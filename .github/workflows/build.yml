name: Build App

on:
  repository_dispatch:
    types: [build-apk]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ github.event.client_payload.config.keystorePassword }}
      KEY_ALIAS: ${{ github.event.client_payload.config.keyAlias }}
      KEY_PASSWORD: ${{ github.event.client_payload.config.keyPassword }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Download User Keystore
        run: |

          if [ "${{ github.event.client_payload.config.generateKeystore }}" = "false" ]; then

            wget "${{ github.event.client_payload.config.keystoreUrl }}" -O release.jks

          else

            keytool -genkey -v \
              -keystore release.jks \
              -storepass "${{ github.event.client_payload.config.keystorePassword }}" \
              -alias "${{ github.event.client_payload.config.keyAlias }}" \
              -keypass "${{ github.event.client_payload.config.keyPassword }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AppBuilder"

          fi

      - name: Replace Application ID
        run: |

          sed -i 's/applicationId = "PACKAGE_PLACEHOLDER"/applicationId = "${{ github.event.client_payload.config.packageName }}"/' app/build.gradle.kts

      - name: Debug Payload
        run: |

          echo "PACKAGE:"
          echo "${{ github.event.client_payload.config.packageName }}"

      - name: Build APK and AAB
        run: |

          chmod +x gradlew

          ./gradlew assembleRelease bundleRelease

      - name: Create ZIP Package
        run: |

          mkdir -p package

          cp final-output/*.apk package/ || true

          cp final-output/*.aab package/ || true

          if [ -f build-info.txt ]; then
            cp build-info.txt package/
          fi

          if [ -f icon.png ]; then
            cp icon.png package/
          fi

          if [ -f splash.png ]; then
            cp splash.png package/
          fi

          if [ -f release.jks ]; then
            cp release.jks package/
          fi

          zip -r "${{ github.event.client_payload.config.zipName }}" package

          mkdir -p upload/${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }}

          mv "${{ github.event.client_payload.config.zipName }}" upload/${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }}/

      - name: Upload ZIP To Hosting
        run: |

          sudo apt-get install -y lftp

          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<EOF

          set ssl:verify-certificate no

          mkdir -p /${{ github.event.client_payload.config.emailFolder }}

          mkdir -p /${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }}

          put upload/${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }}/${{ github.event.client_payload.config.zipName }} -o /${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }}/${{ github.event.client_payload.config.zipName }}

          bye

          EOF
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: upload/
          server-dir: /
          dangerous-clean-slate: false