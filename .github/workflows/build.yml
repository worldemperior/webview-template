name: Build App

on:
  repository_dispatch:
    types: [build-apk]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ github.event.client_payload.config.appName }}
      EMAIL_FOLDER: ${{ github.event.client_payload.config.emailFolder }}
      WEBSITE_URL: ${{ github.event.client_payload.config.websiteUrl }}
      PACKAGE_NAME: ${{ github.event.client_payload.config.packageName }}
      VERSION_NAME: ${{ github.event.client_payload.config.versionName }}
      VERSION_CODE: ${{ github.event.client_payload.config.versionCode }}
      BANNER_AD_ID: ${{ github.event.client_payload.config.bannerAdId }}
      INTERSTITIAL_AD_ID: ${{ github.event.client_payload.config.interstitialAdId }}
      ADMOB_APP_ID: ${{ github.event.client_payload.config.admobAppId }}
      ICON_URL: ${{ github.event.client_payload.config.iconUrl }}
      SPLASH_URL: ${{ github.event.client_payload.config.splashUrl }}
      CONTENT_TYPE: ${{ github.event.client_payload.config.contentType }}
      HTML_CODE: ${{ github.event.client_payload.config.htmlCode }}
      GENERATE_KEYSTORE: ${{ github.event.client_payload.config.generateKeystore }}
      KEYSTORE_URL: ${{ github.event.client_payload.config.keystoreUrl }}
      KEYSTORE_PASSWORD: ${{ github.event.client_payload.config.keystorePassword }}
      KEY_ALIAS: ${{ github.event.client_payload.config.keyAlias }}
      KEY_PASSWORD: ${{ github.event.client_payload.config.keyPassword }}
      ZIP_NAME: ${{ github.event.client_payload.config.zipName }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick
        run: |

          sudo apt-get update
          sudo apt-get install -y imagemagick lftp

      - name: Debug Variables
        run: |

          echo "PACKAGE_NAME=$PACKAGE_NAME"
          echo "ZIP_NAME=$ZIP_NAME"

      - name: Replace Application ID and Namespace
        run: |
          # 1. Update the applicationId and namespace in the build configuration
          sed -i "s|applicationId = \"com.template.webview\"|applicationId = \"$PACKAGE_NAME\"|" app/build.gradle.kts
          sed -i "s|namespace = \"com.template.webview\"|namespace = \"$PACKAGE_NAME\"|" app/build.gradle.kts

      - name: Refactor Kotlin Packages & Directory Structure
        run: |
          # 2. Globally replace the package reference inside all files (Kotlin source files, manifests, layouts)
          find . -type f \( -name "*.kt" -or -name "*.xml" -or -name "*.gradle*" \) -exec sed -i "s|com.template.webview|$PACKAGE_NAME|g" {} +
                
          # 3. Physically move files to a folder path matching the new package name
          # Convert 'com.example.app' into 'com/example/app'
          NEW_DIR=$(echo "$PACKAGE_NAME" | tr '.' '/')
                
          # Create the new directory path inside your project source directories
          mkdir -p "app/src/main/java/$NEW_DIR"
                
          # If files exist in the old folder structure, move them to the new folder structure
          if [ -d "app/src/main/java/com/template/webview" ]; then
            mv app/src/main/java/com/template/webview/* "app/src/main/java/$NEW_DIR/"
            rm -rf app/src/main/java/com/template
          fi

      - name: Replace Placeholders
        run: |

          find . -type f -exec sed -i "s|APP_NAME_PLACEHOLDER|$APP_NAME|g" {} +

          find . -type f -exec sed -i "s|URL_PLACEHOLDER|$WEBSITE_URL|g" {} +

          find . -type f -exec sed -i "s|ADMOB_APP_ID_PLACEHOLDER|$ADMOB_APP_ID|g" {} +

          find . -type f -exec sed -i "s|BANNER_AD_ID_PLACEHOLDER|$BANNER_AD_ID|g" {} +

          find . -type f -exec sed -i "s|INTERSTITIAL_AD_ID_PLACEHOLDER|$INTERSTITIAL_AD_ID|g" {} +

          find . -type f -exec sed -i "s|VERSION_NAME_PLACEHOLDER|$VERSION_NAME|g" {} +

          find . -type f -exec sed -i "s|VERSION_CODE_PLACEHOLDER|$VERSION_CODE|g" {} +

          find . -type f -exec sed -i "s|CONTENT_TYPE_PLACEHOLDER|$CONTENT_TYPE|g" {} +

          find . -type f -exec sed -i "s|HTML_CODE_PLACEHOLDER|$HTML_CODE|g" {} +

      - name: Download Images
        run: |

          if [ ! -z "$ICON_URL" ]; then
            wget "$ICON_URL" -O icon.png || true
          fi

          if [ ! -z "$SPLASH_URL" ]; then
            wget "$SPLASH_URL" -O splash.png || true
          fi

      - name: Download HTML File
        run: |

          mkdir -p app/src/main/assets

          if [ "$CONTENT_TYPE" = "HTML_FILE" ]; then
            wget "$HTML_CODE" -O app/src/main/assets/index.html || true
          fi

      - name: Generate Launcher Icons
        run: |

          if [ -f icon.png ]; then

            convert icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png

            convert icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png

            convert icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png

            convert icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png

            convert icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png

            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png

            cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

            cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Replace Splash Image
        run: |

          mkdir -p app/src/main/res/drawable

          if [ -f splash.png ]; then

            convert splash.png \
              -resize 1080x1920^ \
              -gravity center \
              -extent 1080x1920 \
              PNG32:app/src/main/res/drawable/splash_image.png
          fi

      - name: Prepare Keystore
        run: |

          if [ "$GENERATE_KEYSTORE" = "false" ]; then

            wget "$KEYSTORE_URL" -O release.jks

          else

            keytool -genkey -v \
              -keystore release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AppBuilder"

          fi

      - name: Build APK and AAB
        run: |

          chmod +x gradlew

          ./gradlew assembleRelease bundleRelease

      - name: Prepare Package
        run: |

          mkdir -p package

          find app/build/outputs/apk/release -name "*.apk" -exec cp {} package/app-release.apk \;

          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} package/app-release.aab \;

          cp release.jks package/ || true

          if [ -f icon.png ]; then
            cp icon.png package/
          fi

          if [ -f splash.png ]; then
            cp splash.png package/
          fi

          echo "App Name: $APP_NAME" > package/build-info.txt

          echo "" >> package/build-info.txt
          echo "Package ID: $PACKAGE_NAME" >> package/build-info.txt

          echo "" >> package/build-info.txt
          echo "Version Name: $VERSION_NAME" >> package/build-info.txt

          echo "" >> package/build-info.txt
          echo "Version Code: $VERSION_CODE" >> package/build-info.txt

          echo "" >> package/build-info.txt
          echo "Keystore Password: $KEYSTORE_PASSWORD" >> package/build-info.txt

          echo "" >> package/build-info.txt
          echo "Key Alias: $KEY_ALIAS" >> package/build-info.txt

          echo "" >> package/build-info.txt
          echo "Key Password: $KEY_PASSWORD" >> package/build-info.txt

      - name: Create ZIP
        run: |
          # Convert package name dots to underscores to calculate the correct zip file name locally
          GENERATED_ZIP_NAME=$(echo "${{ github.event.client_payload.config.packageName }}" | tr '.' '_')_build.zip
          echo "ZIP_FILE_NAME=$GENERATED_ZIP_NAME" >> $GITHUB_ENV
          zip -r "$GENERATED_ZIP_NAME" package

      - name: Upload ZIP
        run: |
          # Use the environment variable saved from the previous step
          mkdir -p upload/$EMAIL_FOLDER/$PACKAGE_NAME
          mv "$ZIP_FILE_NAME" upload/$EMAIL_FOLDER/$PACKAGE_NAME/
                
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<EOF
          set ssl:verify-certificate no
          mkdir -p /$EMAIL_FOLDER
          mkdir -p /$EMAIL_FOLDER/$PACKAGE_NAME
          put upload/$EMAIL_FOLDER/$PACKAGE_NAME/$ZIP_FILE_NAME -o /$EMAIL_FOLDER/$PACKAGE_NAME/$ZIP_FILE_NAME
          bye
          EOF