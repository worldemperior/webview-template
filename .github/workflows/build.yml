name: Build App

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ github.event.client_payload.config.appName }}
      EMAIL_FOLDER: ${{ github.event.client_payload.config.emailFolder }}
      WEBSITE_URL: ${{ github.event.client_payload.config.websiteUrl }}
      PACKAGE_NAME: ${{ github.event.client_payload.config.packageName }}
      VERSION_NAME: ${{ github.event.client_payload.config.versionName }}
      VERSION_CODE: ${{ github.event.client_payload.config.versionCode }}
      BANNER_AD_ID: ${{ github.event.client_payload.config.bannerAdId }}
      INTERSTITIAL_AD_ID: ${{ github.event.client_payload.config.interstitialAdId }}
      ADMOB_APP_ID: ${{ github.event.client_payload.config.admobAppId }}
      ICON_URL: ${{ github.event.client_payload.config.iconUrl }}
      SPLASH_URL: ${{ github.event.client_payload.config.splashUrl }}
      CONTENT_TYPE: ${{ github.event.client_payload.config.contentType }}
      HTML_CODE: ${{ github.event.client_payload.config.htmlCode }}
      GENERATE_KEYSTORE: ${{ github.event.client_payload.config.generateKeystore }}
      KEYSTORE_URL: ${{ github.event.client_payload.config.keystoreUrl }}
      KEYSTORE_PASSWORD: ${{ github.event.client_payload.config.keystorePassword }}
      KEY_ALIAS: ${{ github.event.client_payload.config.keyAlias }}
      KEY_PASSWORD: ${{ github.event.client_payload.config.keyPassword }}
      ZIP_NAME: ${{ github.event.client_payload.config.zipName }}
      SHOW_SPLASH: ${{ github.event.client_payload.config.showSplash }}
      DRAWER_ITEM_0_TITLE: ${{ github.event.client_payload.config.drawerItems[0].title || '' }}
      DRAWER_ITEM_0_URL: ${{ github.event.client_payload.config.drawerItems[0].url || '' }}
      DRAWER_ITEM_1_TITLE: ${{ github.event.client_payload.config.drawerItems[1].title || '' }}
      DRAWER_ITEM_1_URL: ${{ github.event.client_payload.config.drawerItems[1].url || '' }}
      DRAWER_ITEM_2_TITLE: ${{ github.event.client_payload.config.drawerItems[2].title || '' }}
      DRAWER_ITEM_2_URL: ${{ github.event.client_payload.config.drawerItems[2].url || '' }}
      DRAWER_ITEM_3_TITLE: ${{ github.event.client_payload.config.drawerItems[3].title || '' }}
      DRAWER_ITEM_3_URL: ${{ github.event.client_payload.config.drawerItems[3].url || '' }}
      USE_DRAWER: ${{ github.event.client_payload.config.useDrawer }}
      USE_RATING: ${{ github.event.client_payload.config.useRating }}
      USE_TITLEBAR: ${{ github.event.client_payload.config.useTitleBar }}
      TITLE_TEXT: ${{ github.event.client_payload.config.titleBarText }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick lftp

      - name: Debug Variables
        run: |
          echo "PACKAGE_NAME=$PACKAGE_NAME"
          echo "ZIP_NAME=$ZIP_NAME"
          echo "USE_DRAWER=$USE_DRAWER"
          echo "USE_RATING=$USE_RATING"
          echo "USE_TITLEBAR=$USE_TITLEBAR"
          echo "TITLE_TEXT=$TITLE_TEXT"
          echo "SHOW_SPLASH=$SHOW_SPLASH"
          echo "CONTENT_TYPE=$CONTENT_TYPE"
          echo "DRAWER_ITEM_0_TITLE=$DRAWER_ITEM_0_TITLE"
          echo "DRAWER_ITEM_0_URL=$DRAWER_ITEM_0_URL"
          echo "DRAWER_ITEM_1_TITLE=$DRAWER_ITEM_1_TITLE"
          echo "DRAWER_ITEM_1_URL=$DRAWER_ITEM_1_URL"
          echo "DRAWER_ITEM_2_TITLE=$DRAWER_ITEM_2_TITLE"
          echo "DRAWER_ITEM_2_URL=$DRAWER_ITEM_2_URL"
          echo "DRAWER_ITEM_3_TITLE=$DRAWER_ITEM_3_TITLE"
          echo "DRAWER_ITEM_3_URL=$DRAWER_ITEM_3_URL"

      - name: Replace Application ID and Namespace
        run: |
          sed -i "s|applicationId = \"com.template.webview\"|applicationId = \"$PACKAGE_NAME\"|" app/build.gradle.kts
          sed -i "s|namespace = \"com.template.webview\"|namespace = \"$PACKAGE_NAME\"|" app/build.gradle.kts

      - name: Refactor Kotlin Packages and Directory Structure
        run: |
          find . -type f \( -name "*.kt" -or -name "*.xml" -or -name "*.gradle*" \) \
            -exec sed -i "s|com.template.webview|$PACKAGE_NAME|g" {} +
          NEW_DIR=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$NEW_DIR"
          if [ -d "app/src/main/java/com/template/webview" ]; then
            mv app/src/main/java/com/template/webview/* "app/src/main/java/$NEW_DIR/"
            rm -rf app/src/main/java/com/template
          fi

      - name: Replace Functional Placeholders and Injections
        run: |
          PACKAGE_DIR=$(echo "$PACKAGE_NAME" | tr '.' '/')
          TARGET_MAIN_FILE="app/src/main/java/$PACKAGE_DIR/MainActivity.kt"
          TARGET_MANIFEST="app/src/main/AndroidManifest.xml"

          echo "Targeting source file at: $TARGET_MAIN_FILE"
          echo "Targeting manifest file at: $TARGET_MANIFEST"

          if [ "$USE_DRAWER" = "true" ];   then FINAL_DRAWER="true";   else FINAL_DRAWER="false";   fi
          if [ "$USE_RATING" = "true" ];   then FINAL_RATING="true";   else FINAL_RATING="false";   fi
          if [ "$USE_TITLEBAR" = "true" ]; then FINAL_TITLEBAR="true"; else FINAL_TITLEBAR="false"; fi

          if [ "$CONTENT_TYPE" = "HTML_FILE" ]; then
            FINAL_DRAWER="false"
            FINAL_RATING="false"
            FINAL_TITLEBAR="false"
          fi

          echo "FINAL_DRAWER=$FINAL_DRAWER"
          echo "FINAL_RATING=$FINAL_RATING"
          echo "FINAL_TITLEBAR=$FINAL_TITLEBAR"

          sed -i "s|private val useDrawer = false|private val useDrawer = $FINAL_DRAWER|g" "$TARGET_MAIN_FILE"
          sed -i "s|private val useRating = false|private val useRating = $FINAL_RATING|g" "$TARGET_MAIN_FILE"
          sed -i "s|private val useTitleBar = false|private val useTitleBar = $FINAL_TITLEBAR|g" "$TARGET_MAIN_FILE"
          sed -i "s|private val showSplashEnabled = \"SHOW_SPLASH_PLACEHOLDER\"|private val showSplashEnabled = \"$SHOW_SPLASH\"|g" "$TARGET_MAIN_FILE"

          if [ ! -z "$TITLE_TEXT" ] && [ "$CONTENT_TYPE" != "HTML_FILE" ]; then
            python3 << 'PYEOF'
          import os
          title = os.environ.get("TITLE_TEXT", "")
          target = os.environ.get("TARGET_MAIN_FILE", "")
          with open(target, "r") as f:
              content = f.read()
          content = content.replace(
              'private val titleText = "My App"',
              'private val titleText = "' + title + '"'
          )
          with open(target, "w") as f:
              f.write(content)
          print("Title text injected: " + title)
          PYEOF
          fi

          if [ "$SHOW_SPLASH" = "false" ]; then
            echo "Bypassing Splash Screen: Stripping SplashActivity from Manifest..."
            sed -i '/android:name="\.SplashActivity"/,+6d' "$TARGET_MANIFEST"
            sed -i 's|<activity android:name="\.MainActivity"/>|<activity android:name="\.MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>|g' "$TARGET_MANIFEST"
          fi

          sed -i "s|DRAWER_LINK_0_CUSTOM|$DRAWER_ITEM_0_URL|g" "$TARGET_MAIN_FILE"
          sed -i "s|DRAWER_LINK_1_CUSTOM|$DRAWER_ITEM_1_URL|g" "$TARGET_MAIN_FILE"
          sed -i "s|DRAWER_LINK_2_CUSTOM|$DRAWER_ITEM_2_URL|g" "$TARGET_MAIN_FILE"
          sed -i "s|DRAWER_LINK_3_CUSTOM|$DRAWER_ITEM_3_URL|g" "$TARGET_MAIN_FILE"

          sed -i "s|DRAWER_TITLE_0_CUSTOM|$DRAWER_ITEM_0_TITLE|g" "$TARGET_MAIN_FILE"
          sed -i "s|DRAWER_TITLE_1_CUSTOM|$DRAWER_ITEM_1_TITLE|g" "$TARGET_MAIN_FILE"
          sed -i "s|DRAWER_TITLE_2_CUSTOM|$DRAWER_ITEM_2_TITLE|g" "$TARGET_MAIN_FILE"
          sed -i "s|DRAWER_TITLE_3_CUSTOM|$DRAWER_ITEM_3_TITLE|g" "$TARGET_MAIN_FILE"

          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|APP_NAME_PLACEHOLDER|$APP_NAME|g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|URL_BASE_MAIN|$WEBSITE_URL|g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|ADMOB_APP_ID_PLACEHOLDER|$ADMOB_APP_ID|g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|BANNER_AD_ID_PLACEHOLDER|$BANNER_AD_ID|g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|INTERSTITIAL_AD_ID_PLACEHOLDER|$INTERSTITIAL_AD_ID|g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|VERSION_NAME_PLACEHOLDER|$VERSION_NAME|g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|VERSION_CODE_PLACEHOLDER|$VERSION_CODE|g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|CONTENT_TYPE_PLACEHOLDER|$CONTENT_TYPE|g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|HTML_CODE_PLACEHOLDER|$HTML_CODE|g" {} +

          echo "=== Verification: injected values ==="
          grep -n "useDrawer\|useRating\|useTitleBar\|titleText\|showSplash" "$TARGET_MAIN_FILE" || true

      - name: Download Images
        run: |
          if [ ! -z "$ICON_URL" ]; then
            wget --timeout=30 --tries=3 "$ICON_URL" -O icon.png || true
          fi
          if [ ! -z "$SPLASH_URL" ] && [ "$SHOW_SPLASH" = "true" ]; then
            wget --timeout=30 --tries=3 "$SPLASH_URL" -O splash.png || true
          fi

      - name: Download HTML File
        run: |
          mkdir -p app/src/main/assets
          if [ "$CONTENT_TYPE" = "HTML_FILE" ]; then
            wget --timeout=30 --tries=3 "$HTML_CODE" -O app/src/main/assets/index.html || {
              echo "HTML download failed — writing fallback page"
              echo "<html><body><p>Content failed to load.</p></body></html>" > app/src/main/assets/index.html
            }
          fi

      - name: Generate Launcher Icons
        run: |
          if [ -f icon.png ]; then
            convert icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp app/src/main/res/mipmap-mdpi/ic_launcher.png    app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png    app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xhdpi/ic_launcher.png   app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png  app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Replace Splash Image
        run: |
          mkdir -p app/src/main/res/drawable
          if [ -f splash.png ] && [ "$SHOW_SPLASH" = "true" ]; then
            convert splash.png \
              -resize 1080x1920^ \
              -gravity center \
              -extent 1080x1920 \
              PNG32:app/src/main/res/drawable/splash_image.png
          fi

      - name: Prepare Keystore
        run: |
          if [ "$GENERATE_KEYSTORE" = "false" ]; then
            wget --timeout=30 --tries=3 "$KEYSTORE_URL" -O release.jks
          else
            keytool -genkey -v \
              -keystore release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AppBuilder"
          fi

      - name: Build APK and AAB
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Prepare Package
        run: |
          mkdir -p package
          find app/build/outputs/apk/release   -name "*.apk" -exec cp {} package/app-release.apk \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} package/app-release.aab \;
          mkdir -p keystore_upload
          cp release.jks keystore_upload/app_keystore.jks
          if [ -f icon.png ]; then
            cp icon.png package/
          fi
          if [ -f splash.png ] && [ "$SHOW_SPLASH" = "true" ]; then
            cp splash.png package/
          fi
          cat > package/build-info.txt << EOF
          App Name: $APP_NAME

          Package ID: $PACKAGE_NAME

          Version Name: $VERSION_NAME

          Version Code: $VERSION_CODE

          Keystore Password: $KEYSTORE_PASSWORD

          Key Alias: $KEY_ALIAS

          Key Password: $KEY_PASSWORD

          Build Date: $(date -u '+%Y-%m-%d %H:%M UTC')

          IMPORTANT: Keep this file somewhere safe.
          You need your keystore password every time you update your app on Google Play.
          EOF

      - name: Create ZIP
        run: |
          GENERATED_ZIP_NAME=$(echo "${{ github.event.client_payload.config.packageName }}" | tr '.' '_')_build.zip
          echo "ZIP_FILE_NAME=$GENERATED_ZIP_NAME" >> $GITHUB_ENV
          zip -r "$GENERATED_ZIP_NAME" package

      - name: Upload ZIP and Separate Keystore
        run: |
          mkdir -p upload/$EMAIL_FOLDER/$PACKAGE_NAME
          mv "$ZIP_FILE_NAME" upload/$EMAIL_FOLDER/$PACKAGE_NAME/
          KEYSTORE_FTP_CMD=""
          if [ -f keystore_upload/app_keystore.jks ]; then
            KEYSTORE_FTP_CMD="put keystore_upload/app_keystore.jks -o /$EMAIL_FOLDER/$PACKAGE_NAME/app_keystore.jks;"
          fi
          lftp -c "
          set ssl:verify-certificate no;
          open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
          put upload/$EMAIL_FOLDER/$PACKAGE_NAME/$ZIP_FILE_NAME -o /$EMAIL_FOLDER/$PACKAGE_NAME/$ZIP_FILE_NAME;
          $KEYSTORE_FTP_CMD
          quit;
          "

      - name: Process Completion and Release Workspace Lock
        if: always()
        env:
          EMAIL_FOLDER: ${{ github.event.client_payload.config.emailFolder }}
          PACKAGE_NAME: ${{ github.event.client_payload.config.packageName }}
        run: |
          lftp -c "
            set ssl:verify-certificate no;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            cd /$EMAIL_FOLDER/$PACKAGE_NAME/ || cd $EMAIL_FOLDER/$PACKAGE_NAME/ || true;
            rm -f build.lock;
            quit;
          "