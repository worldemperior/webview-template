name: Automated Android Multi-Tenant App Builder

on:
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Blueprint
        uses: actions/checkout@v4

      - name: Set up Java Development Kit Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Target Tools
        uses: android-actions/setup-android@v3

      - name: Dynamically Inject Application Configuration Properties
        run: |
          PKG_NAME="${{ github.event.client_payload.config.packageName }}"
          APP_NAME="${{ github.event.client_payload.config.appName }}"
          APP_URL="${{ github.event.client_payload.config.appUrl }}"
          
          echo "Injecting Configurations: Package: $PKG_NAME | Name: $APP_NAME"
          
          # Replace template placeholders globally in structural project configuration files safely
          find . -type f \( -name "AndroidManifest.xml" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "strings.xml" \) -exec sed -i "s/PACKAGE_PLACEHOLDER/$PKG_NAME/g" {} +
          find . -type f \( -name "AndroidManifest.xml" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "strings.xml" \) -exec sed -i "s/APP_NAME_PLACEHOLDER/$APP_NAME/g" {} +
          
          # Replace the endpoint target string within source code configuration layers
          find . -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s|URL_PLACEHOLDER|$APP_URL|g" {} +

      - name: Grant Executable Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Execute Production Production Compilation Build (APK & AAB)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Validate and Package App Outputs
        run: |
          mkdir -p final_workspace_package
          
          # Safely extract generated files from build distributions
          cp app/build/outputs/apk/release/*.apk final_workspace_package/ || echo "No APK binaries found in paths."
          cp app/build/outputs/bundle/release/*.aab final_workspace_package/ || echo "No AAB bundles found in paths."
          
          # CRITICAL VALIDATION STEP: Verify compilation outputs exist before packaging
          if [ ! -f final_workspace_package/*.apk ] && [ ! -f final_workspace_package/*.aab ]; then
            echo "ERROR: Compilation step completed but produced no target binaries. Aborting to avoid empty zip packaging."
            exit 1
          fi
          
          # Bundle configuration records and security tokens
          if [ -f release.jks ]; then cp release.jks final_workspace_package/; fi
          
          echo "Build Timestamp: $(date)" > final_workspace_package/build-info.txt
          echo "Package Target Identity: ${{ github.event.client_payload.config.packageName }}" >> final_workspace_package/build-info.txt
          echo "Application Target Name: ${{ github.event.client_payload.config.appName }}" >> final_workspace_package/build-info.txt
          
          # Compress Workspace to explicit targeting filename passed from server payload
          ZIP_OUTPUT_NAME="${{ github.event.client_payload.config.zipName }}"
          zip -r "$ZIP_OUTPUT_NAME" final_workspace_package
          
          mkdir -p ready_to_ship
          mv "$ZIP_OUTPUT_NAME" ready_to_ship/

      - name: Upload Single Distribution Package via Isolated LFTP Stream
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          
          ZIP_TARGET_FILE="${{ github.event.client_payload.config.zipName }}"
          USER_SUBDIR="${{ github.event.client_payload.config.emailFolder }}"
          APP_SUBDIR="${{ github.event.client_payload.config.packageName }}"
          
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<EOF
          set ssl:verify-certificate no
          mkdir -p /public_html/builds/$USER_SUBDIR/$APP_SUBDIR
          cd /public_html/builds/$USER_SUBDIR/$APP_SUBDIR
          put ready_to_ship/$ZIP_TARGET_FILE -o $ZIP_TARGET_FILE
          bye
          EOF