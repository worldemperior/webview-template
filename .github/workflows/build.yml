name: Automated Webview Template Build Pipeline

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Template Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Dynamically Inject Application Configuration Properties
        run: |
          PROP_NAME="${{ github.event.client_payload.config.appName }}"
          PROP_URL="${{ github.event.client_payload.config.appUrl }}"
          PROP_ADMOB="${{ github.event.client_payload.config.admobAppId }}"
          
          echo "=========================================================="
          echo "Processing Injection Parameters:"
          echo "App Name: $PROP_NAME"
          echo "Target URL: $PROP_URL"
          echo "AdMob App ID: $PROP_ADMOB"
          echo "=========================================================="
          
          # 1. Safely inject App Name into strings.xml resource layer
          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i "s/APP_NAME_PLACEHOLDER/$PROP_NAME/g" app/src/main/res/values/strings.xml
            echo "✓ Successfully injected App Name into strings.xml"
          else
            echo "⚠ Warning: app/src/main/res/values/strings.xml not found!"
          fi
          
          # 2. Inject AdMob ID into Manifest placeholders
          if [ -f app/src/main/AndroidManifest.xml ]; then
            if [ ! -z "$PROP_ADMOB" ]; then
              sed -i "s/ADMOB_APP_ID_PLACEHOLDER/$PROP_ADMOB/g" app/src/main/AndroidManifest.xml
              echo "✓ Successfully injected AdMob App ID into AndroidManifest.xml"
            else
              # Fallback to test ID if empty to prevent build compilation crashes
              sed -i "s/ADMOB_APP_ID_PLACEHOLDER/ca-app-pub-3940256099942544~3347511713/g" app/src/main/AndroidManifest.xml
              echo "⚠ AdMob ID payload missing. Injected Google Test App ID fallback."
            fi
          fi
          
          # 3. Sweep Java and Kotlin files to insert Webview Core URL endpoints
          if [ -d app/src/main ]; then
            find app/src/main -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s|URL_PLACEHOLDER|$PROP_URL|g" {} +
            echo "✓ Completed URL source code layer replacement sweep"
          fi

      - name: Grant Executable Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Production Compilation via Native Project Property Injection
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PKG_NAME="${{ github.event.client_payload.config.packageName }}"
          
          echo "Executing build for Application ID package target: $PKG_NAME"
          
          # We pass the package name directly to your dynamic build.gradle.kts setup using -PappId
          ./gradlew clean assembleRelease bundleRelease -PappId="$PKG_NAME" --stacktrace

      - name: Upload Generated Binaries to Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: generated-production-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab