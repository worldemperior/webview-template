name: Automated Webview Template Build Pipeline

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Template Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Debug and Verify Payload Value Chain
        run: |
          echo "=========================================================="
          echo "Verifying incoming client_payload.config values:"
          echo "Target Package Name : ${{ github.event.client_payload.config.packageName }}"
          echo "Target App Name     : ${{ github.event.client_payload.config.appName }}"
          echo "Target Endpoint URL : ${{ github.event.client_payload.config.appUrl }}"
          echo "Target AdMob App ID : ${{ github.event.client_payload.config.admobAppId }}"
          echo "Target Host Directory: ${{ github.event.client_payload.config.emailFolder }}"
          echo "Target Target ZIP    : ${{ github.event.client_payload.config.zipName }}"
          echo "=========================================================="

      - name: Dynamically Inject Resource Configurations
        run: |
          PROP_NAME="${{ github.event.client_payload.config.appName }}"
          PROP_URL="${{ github.event.client_payload.config.appUrl }}"
          PROP_ADMOB="${{ github.event.client_payload.config.admobAppId }}"
          
          # 1. Inject App Name safely into strings.xml resource layer
          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i "s/APP_NAME_PLACEHOLDER/$PROP_NAME/g" app/src/main/res/values/strings.xml
            echo "✓ Successfully injected App Name into strings.xml"
          fi
          
          # 2. Inject AdMob configuration layers safely [cite: 38258]
          if [ -f app/src/main/AndroidManifest.xml ]; then
            if [ ! -z "$PROP_ADMOB" ] && [ "$PROP_ADMOB" != "null" ]; then
              sed -i "s/ADMOB_APP_ID_PLACEHOLDER/$PROP_ADMOB/g" app/src/main/AndroidManifest.xml
              [cite_start]echo "✓ Successfully injected AdMob App ID into AndroidManifest.xml [cite: 38243]"
            else
              # Fallback to official safe AdMob test id to prevent structural build crashes [cite: 38243]
              sed -i "s/ADMOB_APP_ID_PLACEHOLDER/ca-app-pub-3940256099942544~3347511713/g" app/src/main/AndroidManifest.xml
              echo "⚠ AdMob ID field empty. Applied fallback production profile testing keys."
            fi
          fi
          
          # 3. Sweep Source Layer to apply structural Webview core URLs
          if [ -d app/src/main ]; then
            find app/src/main -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s|URL_PLACEHOLDER|$PROP_URL|g" {} +
            echo "✓ Source code endpoint replacement sweep completed successfully"
          fi

      - name: Generate Local Build Descriptor Metadata
        run: |
          echo "App Name: ${{ github.event.client_payload.config.appName }}" > build-info.txt
          echo "Package Name: ${{ github.event.client_payload.config.packageName }}" >> build-info.txt
          echo "Target URL: ${{ github.event.client_payload.config.appUrl }}" >> build-info.txt
          echo "Build Timestamp: $(date)" >> build-info.txt

      - name: Grant Executable Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Execute Production Build via Clean Project Property Overrides
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TARGET_PKG="${{ github.event.client_payload.config.packageName }}"
          
          # Inject package ID using modern project property argument arrays to bypass source file corruption 
          ./gradlew clean assembleRelease bundleRelease -PappId="$TARGET_PKG" --stacktrace

      - name: Process Isolated Production Export Assets
        run: |
          mkdir -p package
          cp app/build/outputs/apk/release/*.apk package/ || true [cite: 38244]
          cp app/build/outputs/bundle/release/*.aab package/ || true [cite: 38244]
          
          [cite_start]if [ -f build-info.txt ]; then cp build-info.txt package/; fi [cite: 38244]
          [cite_start]if [ -f release.jks ]; then cp release.jks package/; fi [cite: 38244]
          
          ZIP_OUTPUT_NAME="${{ github.event.client_payload.config.zipName }}"
          [cite_start]zip -r "$ZIP_OUTPUT_NAME" package [cite: 38244]
          
          # Isolate directory workspace path dynamically matching target host pattern matrices [cite: 38244, 38245]
          [cite_start]mkdir -p upload/${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }} [cite: 38244]
          [cite_start]mv "$ZIP_OUTPUT_NAME" upload/${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }}/ [cite: 38244]

      - name: Secure Remote LFTP Deployment Sweep
        run: |
          sudo apt-get update && sudo apt-get install -y lftp [cite: 38243]
          
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<EOF
          set ssl:verify-certificate no
          [cite_start]mkdir -p /builds/${{ github.event.client_payload.config.emailFolder }} [cite: 38243]
          [cite_start]mkdir -p /builds/${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }} [cite: 38243]
          [cite_start]put upload/${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }}/${{ github.event.client_payload.config.zipName }} -o /builds/${{ github.event.client_payload.config.emailFolder }}/${{ github.event.client_payload.config.packageName }}/${{ github.event.client_payload.config.zipName }} [cite: 38243]
          bye
          EOF