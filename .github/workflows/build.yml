name: Build App

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ github.event.client_payload.config.appName }}
      EMAIL_FOLDER: ${{ github.event.client_payload.config.emailFolder }}
      WEBSITE_URL: ${{ github.event.client_payload.config.websiteUrl }}
      PACKAGE_NAME: ${{ github.event.client_payload.config.packageName }}
      VERSION_NAME: ${{ github.event.client_payload.config.versionName }}
      VERSION_CODE: ${{ github.event.client_payload.config.versionCode }}
      BANNER_AD_ID: ${{ github.event.client_payload.config.bannerAdId }}
      INTERSTITIAL_AD_ID: ${{ github.event.client_payload.config.interstitialAdId }}
      ADMOB_APP_ID: ${{ github.event.client_payload.config.admobAppId }}
      ICON_URL: ${{ github.event.client_payload.config.iconUrl }}
      SPLASH_URL: ${{ github.event.client_payload.config.splashUrl }}
      CONTENT_TYPE: ${{ github.event.client_payload.config.contentType }}
      HTML_CODE: ${{ github.event.client_payload.config.htmlCode }}
      GENERATE_KEYSTORE: ${{ github.event.client_payload.config.generateKeystore }}
      KEYSTORE_URL: ${{ github.event.client_payload.config.keystoreUrl }}
      KEYSTORE_PASSWORD: ${{ github.event.client_payload.config.keystorePassword }}
      KEY_ALIAS: ${{ github.event.client_payload.config.keyAlias }}
      KEY_PASSWORD: ${{ github.event.client_payload.config.keyPassword }}
      ZIP_NAME: ${{ github.event.client_payload.config.zipName }}
      USE_DRAWER: ${{ github.event.client_payload.config.useDrawer }}
      USE_RATING: ${{ github.event.client_payload.config.useRating }}
      USE_TITLEBAR: ${{ github.event.client_payload.config.useTitleBar }}
      TITLE_TEXT: ${{ github.event.client_payload.config.titleBarText }}
      DRAWER_TITLES: ${{ github.event.client_payload.config.drawerTitles }}
      DRAWER_URLS: ${{ github.event.client_payload.config.drawerUrls }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick lftp

      - name: Replace Application ID and Namespace
        run: |
          sed -i "s|applicationId = \"com.template.webview\"|applicationId = \"$PACKAGE_NAME\"|" app/build.gradle.kts
          sed -i "s|namespace = \"com.template.webview\"|namespace = \"$PACKAGE_NAME\"|" app/build.gradle.kts

      - name: Refactor Kotlin Packages and Directory Structure
        run: |
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" \) \
            -exec sed -i "s|com\.template\.webview|$PACKAGE_NAME|g" {} +
          NEW_DIR=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$NEW_DIR"
          if [ -d "app/src/main/java/com/template/webview" ]; then
            mv app/src/main/java/com/template/webview/* "app/src/main/java/$NEW_DIR/"
            rm -rf app/src/main/java/com/template
          fi

      - name: Inject Boolean Feature Flags
        run: |
          PACKAGE_DIR=$(echo "$PACKAGE_NAME" | tr '.' '/')
          TARGET="app/src/main/java/$PACKAGE_DIR/MainActivity.kt"
          sed -i "s/private val useDrawer = false/private val useDrawer = $USE_DRAWER/" "$TARGET"
          sed -i "s/private val useRating = false/private val useRating = $USE_RATING/" "$TARGET"
          sed -i "s/private val useTitleBar = false/private val useTitleBar = $USE_TITLEBAR/" "$TARGET"

      - name: Inject Title Bar Text
        run: |
          python3 - <<'PYEOF'
          # python script here...
          PYEOF

      - name: Inject Drawer Links
        run: |
          python3 - <<'PYEOF'
          # python script here...
          PYEOF

      - name: Inject All Remaining Placeholders
        run: |
          python3 - <<'PYEOF'
          # python script here...
          PYEOF

      - name: Inject Placeholders Into XML and Manifest
        run: |
          find app/src/main/res -type f -name "*.xml" -exec sed -i "s|APP_NAME_PLACEHOLDER|$APP_NAME|g" {} +
          find app/src/main/res -type f -name "*.xml" -exec sed -i "s|ADMOB_APP_ID_PLACEHOLDER|$ADMOB_APP_ID|g" {} +
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s|APP_NAME_PLACEHOLDER|$APP_NAME|g" app/src/main/AndroidManifest.xml
            sed -i "s|ADMOB_APP_ID_PLACEHOLDER|$ADMOB_APP_ID|g" app/src/main/AndroidManifest.xml
          fi

      - name: Download Icon and Splash Images
        run: |
          # wget commands...

      - name: Download HTML File Asset
        run: |
          # wget commands...

      - name: Generate Launcher Icons
        run: |
          # imagemagick convert commands...

      - name: Process Splash Screen Image
        run: |
          # convert splash.png...

      - name: Prepare Signing Keystore
        run: |
          # keytool or wget...

      - name: Configure Signing in Gradle
        run: |
          python3 - <<'PYEOF'
          # python script here...
          PYEOF

      - name: Build Release APK and AAB
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Assemble Output Package
        run: |
          # package assembly commands...

      - name: Create ZIP Archive
        run: |
          # zip commands...

      - name: Upload ZIP via FTP
        run: |
          # lftp commands...

      - name: Release Build Lock
        if: always()
        run: |
          # lftp cleanup...
